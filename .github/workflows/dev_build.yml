name: Build Dev Artifact
on: push

# У новых репозиториев GITHUB_TOKEN по умолчанию только на чтение, а шаг Release
# создаёт и обновляет релизы — без явных прав он упал бы с 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build with Gradle
        run: ./gradlew build

      # Релизы создаёт только release-all.yml: он собирает все версии и
      # публикует их одним релизом. Этот воркфлоу лишь проверяет, что ветка
      # собирается, и отдаёт джар как артефакт Actions — иначе каждый пуш
      # добавлял бы файл в prerelease "snapshot" и там копились сборки
      # разных версий с неразличимыми именами.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
