name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build with Gradle
        run: ./gradlew build

      - name: Определить версию Minecraft
        id: mc
        run: |
          mc=$(grep -E '^minecraft = "' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$mc" >> "$GITHUB_OUTPUT"
          echo "Собираю релиз для Minecraft $mc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: B2XY ${{ github.ref_name }} для Minecraft ${{ steps.mc.outputs.version }}
          files: |
            ./build/libs/*.jar
          fail_on_unmatched_files: true
          body: |
            Сборка аддона для **Minecraft ${{ steps.mc.outputs.version }}**.

            Требуется Meteor Client для этой же версии Minecraft и Java 21.
            Файл кладётся в папку `mods` рядом с Meteor Client.
